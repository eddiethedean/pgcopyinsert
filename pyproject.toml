[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgcopyinsert"
version = "0.3.0"
description = "Faster PostgreSQL bulk inserts by COPY to a temp table, then INSERT into the target table."
readme = "README.md"
license = "MIT"
authors = [{ name = "Odos Matthews" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "sqlalchemy>=2.0",
  "fullmetalcopy>=0.1.0",
]

[project.optional-dependencies]
asyncpg = ["asyncpg", "sqlalchemy[asyncio]"]
psycopg = ["psycopg", "sqlalchemy[asyncio]"]
psycopg2 = ["psycopg2-binary"]
pandas = ["pandas", "pyarrow"]
polars = ["polars"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.11",
  "testing.postgresql>=1.3",
  "psycopg2-binary",
  "pandas",
  "polars",
  "pyarrow",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/pgcopyinsert"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgcopyinsert = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
packages = ["pgcopyinsert"]

[[tool.mypy.overrides]]
module = ["fullmetalcopy.*", "pandas", "pandas.*", "polars", "polars.*"]
ignore_missing_imports = true
